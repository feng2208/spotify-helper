name: Check sp

on:
  schedule:
    - cron: '1 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Update sp.json from remote
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f sp.json ]]; then
            echo "sp.json not found"
            exit 1
          fi

          remote_file="$(mktemp)"
          cleanup() {
            if [[ -f "${remote_file}" ]]; then
              rm -f "${remote_file}"
            fi
          }
          trap cleanup EXIT

          echo "Downloading remote json file..."
          curl -fsSL https://spcf.tangchao.workers.dev/sp/sp.json -o "${remote_file}"
          
          # Ensure it's a valid JSON array of strings
          jq -e 'type == "array" and all(.[]; type == "string")' "${remote_file}" > /dev/null

          # Check if there is any item in local sp.json that is NOT in the downloaded json file
          missing_count=$(jq --slurpfile remote "${remote_file}" '[.[] | select(. as $i | $remote[0] | index($i) | not)] | length' sp.json)

          if [[ "${missing_count}" -gt 0 ]]; then
            echo "Found item(s) in local sp.json that are not in the remote json file."
            echo "Randomly selecting 3 items from the remote json file to update sp.json..."
            jq -r '.[]' "${remote_file}" | shuf -n 3 | jq -R . | jq -s . > sp.json
          else
            echo "All items in sp.json are present in the remote json file. No changes needed."
          fi
      - name: Commit sp.json
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- sp.json; then
            echo "No change in sp.json"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sp.json
          git commit -m "ci: update reachable endpoints"
          git push
